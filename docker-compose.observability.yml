# docker-compose.observability.yml — F7.5
#
# Stack de observabilidad opcional (profile aparte). No se fuerza su uso:
# el /metrics de F7.1 sirve standalone sin Prometheus/Grafana.
#
# Uso:
#   docker compose -f docker-compose.yml -f docker-compose.observability.yml --profile observability up -d
#
# Endpoints:
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000 (admin/admin por defecto)
#   App:        http://localhost:8001

services:
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    profiles:
      - observability
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - vision-net
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    container_name: grafana
    profiles:
      - observability
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - vision-net
    restart: unless-stopped
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:

networks:
  vision-net:
    external: false
    name: n8n_default
